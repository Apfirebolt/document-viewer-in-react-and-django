version: '3.8'

services:
  # 1. Kafka Broker Service
  kafka:
    image: confluentinc/cp-kafka:7.6.1 # Recommended image for stability and ease of use
    hostname: kafka
    container_name: kafka
    ports:
      # Port 9092 is for external clients (like your local machine) to connect to
      - '9092:9092'
    environment:
      # --- Cluster Configuration (KRaft Mode) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller' # This node is both a broker and a controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093' # Node ID and internal listener address

      # --- Listener Configuration ---
      # 9092: External for clients (mapped to host:9092)
      # 9093: Internal for inter-broker/controller communication
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092' # How external clients connect
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # --- Initial Setup ---
      # This is a static ID; it's required for KRaft. You can generate a random one, but this one works.
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ' 

      # For a single-node setup, these should be 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    # Format the storage on startup if it hasn't been done
    command: "bash -c \"
      kafka-storage format --type kraft -t $${CLUSTER_ID} -c /etc/kafka/server.properties &&
      /etc/confluent/docker/run
    \""
    
    # Persist data so topics and messages aren't lost when the container stops
    volumes:
      - kafka-data:/var/lib/kafka/data

  # 2. Kafka UI Service (Optional but Recommended)
  # Provides a nice web interface to manage topics, view messages, etc.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - '8080:8080' # Access the UI via http://localhost:8080
    environment:
      # Point the UI to the Kafka broker's advertised listener
      KAFKA_CLUSTERS_0_NAME: local-kafka-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093 # Internal connection using the service name and internal port
      
volumes:
  kafka-data:
    driver: local